[project]
name = "agent-assembly-line"
version = "0.1.0"
description = "Taylor- and Toyota-style production lines for AI agents: cheap workers, strict schemas, an inspector that can stop the line."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "pyyaml>=6",
  "jsonschema>=4",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
line = "assembly_line.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assembly_line"]
